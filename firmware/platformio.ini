; ORUN TLP M0: RAK4630/RAK4631 Arduino firmware target.
[platformio]
default_envs = rak4630
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52@11.0.0
board = rak4630
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/check_storage_layout.py
    post:scripts/patch_wire.py
    post:scripts/patch_radio.py
    post:scripts/patch_internalfs.py
    post:scripts/patch_ble_flash.py
build_src_filter = ${env.build_src_filter}+<../rakwireless/variants/rak4630>
build_flags =
    -I rakwireless/variants/rak4630
    -I include
lib_deps =
    beegee-tokyo/SX126x-Arduino@2.0.32
    sparkfun/SparkFun u-blox GNSS Arduino Library@2.2.29


; M7P7A build-only integration target. Production BLE remains disabled.
; This target forces Bluefruit + relocated InternalFS + FlashMutationGate into
; one linked image so the pinned framework patches and strong ORUN hooks are
; compiler/linker checked without changing shipped runtime composition.
[env:rak4630_m7p7a_compile]
extends = env:rak4630
; Do not inherit production's radio/GNSS lib_deps here. This target exists
; only to compile/link the BLE/InternalFS bridge; inheriting unrelated libs
; pulled Wire into this synthetic graph even though the smoke source does not
; use it, which made the existing post-LDF Wire patch require TinyUSB include
; propagation for an irrelevant library. The needed Adafruit framework
; libraries are discovered directly from the smoke source includes below.
lib_deps =
; Do not inherit production's extra_scripts either. patch_wire.py's audited
; fragment lives in Wire_nRF52.cpp (not part of this graph) so it is inert
; here either way, but patch_radio.py's apply() unconditionally resolves
; SX126x-Arduino's library.json from this env's own libdeps dir -- and this
; env intentionally installs no radio library (see lib_deps above), so it
; would always fail with FileNotFoundError. Radio arbitration is unrelated to
; the BLE/InternalFS flash-ownership bridge this target exists to prove, so
; the minimal, correct fix is to not run that script here rather than make
; patch_radio.py tolerate a missing SX126x-Arduino globally. The storage
; layout audit and the M7P7A InternalFS/Bluefruit patches remain, since they
; are exactly what this target must prove compiles/links.
extra_scripts =
    pre:scripts/check_storage_layout.py
    post:scripts/patch_internalfs.py
    post:scripts/patch_ble_flash.py
build_src_filter =
    -<*>
    +<flash_mutation_gate.cpp>
    +<monotonic_time.cpp>
    +<nrf_history_flash.cpp>
    +<nrf_config_flash.cpp>
    +<nrf_security_flash.cpp>
    +<../tests/m7/m7p7a_compile_smoke.cpp>
    +<../rakwireless/variants/rak4630>


; M7P7B TEMPORARY physical flash-concurrency probe. Test-only image: the
; production rak4630 env neither builds nor recognizes the `FLASH PROBE`
; serial command. Identical to production otherwise (same sources, libs,
; patches and M7P7A ownership guards); only -DORUN_M7P7B_FLASH_PROBE=1 is added.
; Never flash this to a deployed unit.
[env:rak4630_m7p7b_flash_probe]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -D ORUN_M7P7B_FLASH_PROBE=1


; M7P6C TEST-ONLY target crypto known-answer probe.
; This image is never production firmware. It proves the exact framework-pinned
; Adafruit nRFCrypto / CryptoCell CC310 implementation can execute RFC5869
; HKDF-SHA256 and RFC3610 AES-128-CCM vectors, including fail-closed tag
; rejection, before any ORUN secure-envelope wire format is frozen.
[env:rak4630_m7p6c_crypto_probe]
extends = env:rak4630
build_src_filter =
    -<*>
    +<../tests/m7/m7p6c_crypto_probe.cpp>
    +<../rakwireless/variants/rak4630>
