; ORUN TLP M0: RAK4630/RAK4631 Arduino firmware target.
[platformio]
default_envs = rak4630
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52@11.0.0
board = rak4630
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/check_storage_layout.py
    post:scripts/patch_wire.py
    post:scripts/patch_radio.py
    post:scripts/patch_internalfs.py
    post:scripts/patch_ble_flash.py
build_src_filter = ${env.build_src_filter}+<../rakwireless/variants/rak4630>
build_flags =
    -I rakwireless/variants/rak4630
    -I include
lib_deps =
    beegee-tokyo/SX126x-Arduino@2.0.32
    sparkfun/SparkFun u-blox GNSS Arduino Library@2.2.29


; M7P7A build-only integration target. Production BLE remains disabled.
; This target forces Bluefruit + relocated InternalFS + FlashMutationGate into
; one linked image so the pinned framework patches and strong ORUN hooks are
; compiler/linker checked without changing shipped runtime composition.
[env:rak4630_m7p7a_compile]
extends = env:rak4630
build_src_filter =
    -<*>
    +<flash_mutation_gate.cpp>
    +<nrf_history_flash.cpp>
    +<nrf_config_flash.cpp>
    +<nrf_security_flash.cpp>
    +<../tests/m7/m7p7a_compile_smoke.cpp>
    +<../rakwireless/variants/rak4630>
