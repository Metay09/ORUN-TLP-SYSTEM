; ORUN TLP M0: RAK4630/RAK4631 Arduino firmware target.
[platformio]
default_envs = rak4630
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52@11.0.0
board = rak4630
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/check_storage_layout.py
    post:scripts/patch_wire.py
    post:scripts/patch_radio.py
    post:scripts/patch_internalfs.py
    post:scripts/patch_ble_flash.py
build_src_filter = ${env.build_src_filter}+<../rakwireless/variants/rak4630>
build_flags =
    -I rakwireless/variants/rak4630
    -I include
lib_deps =
    beegee-tokyo/SX126x-Arduino@2.0.32
    sparkfun/SparkFun u-blox GNSS Arduino Library@2.2.29


; SF3 TEST-ONLY physical runtime qualification image.
; Uses the normal production source graph and actual physical History/Security
; stores, but shortens backlog probe timing and exposes an explicit serial
; command that can provision the fixed PUBLIC test credential on a development
; unit. Never use on deployed hardware. Clean the SecurityStore after testing.
[env:rak4630_sf3_runtime_qual]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -D ORUN_SF3_RUNTIME_QUAL=1


; M6D2 TEST-ONLY physical geofence confirmation probe.
; This env now inherits M6D3C durable boot activation from production. Its
; temporary first-fix rectangle is therefore intended only when the durable
; geofence resource is CLEAR/unconfigured. If a CONFIGURED durable snapshot is
; present, production runtime authority wins and the legacy probe fixture may
; not arm; clear the qualification unit first before using this probe for the
; original INSIDE -> OUTSIDE -> INSIDE confirmation/cadence exercise.
; Never deploy this image.
[env:rak4630_m6d2_geofence_probe]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -D ORUN_M6D2_GEOFENCE_PROBE=1


; M7P7A build-only integration target. Production BLE remains disabled.
; This target forces Bluefruit + relocated InternalFS + FlashMutationGate into
; one linked image so the pinned framework patches and strong ORUN hooks are
; compiler/linker checked without changing shipped runtime composition.
[env:rak4630_m7p7a_compile]
extends = env:rak4630
; Do not inherit production's radio/GNSS lib_deps here. This target exists
; only to compile/link the BLE/InternalFS bridge; inheriting unrelated libs
; pulled Wire into this synthetic graph even though the smoke source does not
; use it, which made the existing post-LDF Wire patch require TinyUSB include
; propagation for an irrelevant library. The needed Adafruit framework
; libraries are discovered directly from the smoke source includes below.
lib_deps =
; Do not inherit production's extra_scripts either. patch_wire.py's audited
; fragment lives in Wire_nRF52.cpp (not part of this graph) so it is inert
; here either way, but patch_radio.py's apply() unconditionally resolves
; SX126x-Arduino's library.json from this env's own libdeps dir -- and this
; env intentionally installs no radio library (see lib_deps above), so it
; would always fail with FileNotFoundError. Radio arbitration is unrelated to
; the BLE/InternalFS flash-ownership bridge this target exists to prove, so
; the minimal, correct fix is to not run that script here rather than make
; patch_radio.py tolerate a missing SX126x-Arduino globally. The storage
; layout audit and the M7P7A InternalFS/Bluefruit patches remain, since they
; are exactly what this target must prove compiles/links.
extra_scripts =
    pre:scripts/check_storage_layout.py
    post:scripts/patch_internalfs.py
    post:scripts/patch_ble_flash.py
build_src_filter =
    -<*>
    +<flash_mutation_gate.cpp>
    +<monotonic_time.cpp>
    +<nrf_history_flash.cpp>
    +<nrf_config_flash.cpp>
    +<nrf_security_flash.cpp>
    +<../tests/m7/m7p7a_compile_smoke.cpp>
    +<../rakwireless/variants/rak4630>


; M7P7B TEMPORARY physical flash-concurrency probe. Test-only image: the
; production rak4630 env neither builds nor recognizes the `FLASH PROBE`
; serial command. Identical to production otherwise (same sources, libs,
; patches and M7P7A ownership guards); only -DORUN_M7P7B_FLASH_PROBE=1 is added.
; Never flash this to a deployed unit.
[env:rak4630_m7p7b_flash_probe]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -D ORUN_M7P7B_FLASH_PROBE=1


; M7P6C TEST-ONLY target crypto known-answer probe.
; This image is never production firmware. It proves the exact framework-pinned
; Adafruit nRFCrypto / CryptoCell CC310 implementation can execute RFC5869
; HKDF-SHA256 and RFC3610 AES-128-CCM vectors, including fail-closed tag
; rejection, before any ORUN secure-envelope wire format is frozen.
[env:rak4630_m7p6c_crypto_probe]
extends = env:rak4630
; Keep this proof target isolated from production radio/GNSS dependencies.
; Inheriting SX126x + SparkFun GNSS needlessly pulls Wire into the synthetic
; graph; production's pinned Wire patch then includes Adafruit_TinyUSB.h from
; a library whose include path is not propagated to that unrelated dependency
; graph. The probe needs only framework-bundled TinyUSB + Adafruit nRFCrypto.
; This mirrors the existing M7P7A compile-smoke isolation discipline.
lib_deps =
; Production patch scripts are irrelevant to this synthetic crypto image.
; In particular patch_radio.py requires SX126x-Arduino to be installed, which
; this target intentionally does not include.
extra_scripts =
build_src_filter =
    -<*>
    +<../tests/m7/m7p6c_crypto_probe.cpp>
    +<../rakwireless/variants/rak4630>


; M7P6E TEST-ONLY full-production-graph CryptoCell + Bluefruit coexistence
; probe. This target deliberately keeps production radio/GNSS/BLE/storage
; sources and patch scripts, adding only a probe macro plus the target-only
; probe translation unit. It never becomes the default production image.
[env:rak4630_m7p6e_crypto_ble_probe]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -I tests/m7
    -D ORUN_M7P6E_CRYPTO_BLE_PROBE=1
build_src_filter =
    ${env.build_src_filter}
    +<../rakwireless/variants/rak4630>
    +<../tests/m7/m7p6e_crypto_ble_probe.cpp>


; M7P6I TEST-ONLY full-production-graph KAT for the actual
; HistorySecureCrypto production class. Uses a RAM-backed SecurityStore with
; public vector material after Bluefruit.begin(); it never mutates the physical
; SecurityStore partition and never enables History secure RF runtime.
[env:rak4630_m7p6i_history_crypto_probe]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -I tests/m7
    -D ORUN_M7P6I_HISTORY_CRYPTO_PROBE=1
build_src_filter =
    ${env.build_src_filter}
    +<../rakwireless/variants/rak4630>
    +<../tests/m7/m7p6i_history_crypto_probe.cpp>


; M7P6F M3 TEST-ONLY physical partial-erase sentinel.
; Destructively owns ONLY SecurityStore 0x0E7000..0x0E9000 on the test unit.
; Uses the nRF52840 NVMC ERASEPAGEPARTIAL primitive to create a real mixed
; stale-page image, resets, then runs the production SecurityStore synchronous
; recovery path. This is not production firmware and must never be left on a
; deployed/provisioned node.
[env:rak4630_m7p6f_m3_partial_erase_probe]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<security_store.cpp>
    +<security_format.cpp>
    +<journal_format.cpp>
    +<nrf_security_flash.cpp>
    +<../tests/m7/m7p6f_m3_partial_erase_probe.cpp>
    +<../rakwireless/variants/rak4630>


; M7P6F TEST-ONLY post-sentinel cleanup helper. Destructively erases and
; read-verifies ONLY SecurityStore 0x0E7000..0x0E9000 after an explicit
; serial CLEAN command. Used to return a development RAK4631 from M7P6F
; sentinel state to a blank SecurityStore before production firmware restore.
; Never flash this target to a deployed/provisioned node.
[env:rak4630_m7p6f_security_cleanup]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<nrf_security_flash.cpp>
    +<../tests/m7/m7p6f_security_cleanup.cpp>
    +<../rakwireless/variants/rak4630>


; ConfigStore v2 TEST-ONLY physical qualification helper.
; Uses the real ConfigStore/NrfConfigFlash/CSPRNG path with SoftDevice disabled.
; Explicit CLEAN destructively owns ONLY 0x0E9000..0x0EAFFF, then read-verifies
; the complete 8 KiB ConfigStore region. STATUS is read-only and reports both
; page classifiers plus token/incarnation evidence. Never deploy this image.
[env:rak4630_config_v2_qual_probe]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<config_store.cpp>
    +<config_format.cpp>
    +<config_incarnation_source.cpp>
    +<journal_format.cpp>
    +<nrf_config_flash.cpp>
    +<../tests/m7/config_v2_qual_probe.cpp>
    +<../rakwireless/variants/rak4630>


; ConfigStore v2 TEST-ONLY fresh-baseline electrical power-cut probe.
; Requires a blank ConfigStore partition. Uses real ConfigStore/RNG/NrfConfigFlash
; for the baseline body+CRC program and stage readback, then a wrapper blocks the
; exact 4-byte commit program before it reaches flash. The operator removes real
; power at the repeated CUT POWER NOW prompt. On reboot the same image exercises
; the production staged-record recovery path. Never deploy this image.
[env:rak4630_config_v2_baseline_powercut_probe]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<config_store.cpp>
    +<config_format.cpp>
    +<config_incarnation_source.cpp>
    +<journal_format.cpp>
    +<nrf_config_flash.cpp>
    +<../tests/m7/config_v2_baseline_powercut_probe.cpp>
    +<../rakwireless/variants/rak4630>


; ConfigStore v2 TEST-ONLY normal-save persistence-boundary power-cut probe.
; Requires an existing valid v2 baseline. Explicit serial commands exercise the
; real requestSave()/poll() path through NrfConfigFlash and stop after inactive
; page erase, after body+CRC stage readback, or after commit-word physical
; readback but before ConfigStore final publication. Never deploy this image.
[env:rak4630_config_v2_normal_save_powercut_probe]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<config_store.cpp>
    +<config_format.cpp>
    +<config_incarnation_source.cpp>
    +<journal_format.cpp>
    +<nrf_config_flash.cpp>
    +<../tests/m7/config_v2_normal_save_powercut_probe.cpp>
    +<../rakwireless/variants/rak4630>


; M6D3B TEST-ONLY READ-ONLY GeofenceStore preflight.
; Contains no NrfGeofenceFlash or sd_flash_* mutation path. It only reads and
; classifies 0x0E5000..0x0E7000 and reports all_ff. The destructive M6D3B
; qualification target must not be used unless this image reports both pages
; all_ff=yes on the intended development unit.
[env:rak4630_m6d3b_geofence_preflight]
extends = env:rak4630
lib_deps =
extra_scripts =
build_src_filter =
    -<*>
    +<geofence_format.cpp>
    +<geofence_geometry.cpp>
    +<journal_format.cpp>
    +<tlp_position_packet.cpp>
    +<../tests/m6/m6d3b_geofence_preflight.cpp>
    +<../rakwireless/variants/rak4630>


; M6D3B TEST-ONLY DESTRUCTIVE GeofenceStore persistence qualification.
; PRECONDITION: the separate read-only preflight target reported all_ff=yes.
; Uses the real GeofenceStore + NrfGeofenceFlash + raw nRF RNG path with
; SoftDevice disabled. Owns ONLY 0x0E5000..0x0E7000. Never deploy this image.
[env:rak4630_m6d3b_geofence_qual]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<geofence_store.cpp>
    +<geofence_format.cpp>
    +<geofence_geometry.cpp>
    +<geofence_incarnation_source.cpp>
    +<journal_format.cpp>
    +<tlp_position_packet.cpp>
    +<nrf_geofence_flash.cpp>
    +<../tests/m6/m6d3b_geofence_qual.cpp>
    +<../rakwireless/variants/rak4630>


; M6D3B TEST-ONLY focused electrical power-cut probe.
; Requires an existing VALID GeofenceStore authority on the already qualified
; development unit. Boot/recovery is read-only. The explicit CUT_BODY command
; uses the real GeofenceStore + NrfGeofenceFlash path, physically erases the
; inactive page and programs/read-verifies body+CRC, then deliberately withholds
; the exact 4-byte commit write while repeating CUT POWER NOW. Never deploy.
[env:rak4630_m6d3b_geofence_powercut]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<geofence_store.cpp>
    +<geofence_format.cpp>
    +<geofence_geometry.cpp>
    +<journal_format.cpp>
    +<tlp_position_packet.cpp>
    +<nrf_geofence_flash.cpp>
    +<../tests/m6/m6d3b_geofence_powercut_probe.cpp>
    +<../rakwireless/variants/rak4630>


; M4P3 TEST-ONLY History v4 physical qualification helper.
; STATUS is read-only and classifies all seven History pages. CLEAN is the only
; mutation command: after explicit operator approval it destructively erases
; ONLY History 0x0ED000..0x0F3FFF and read-verifies the complete 28 KiB region
; as 0xFF. This image never constructs HistoryStore, so it cannot create a v4
; stream by itself. After CLEAN PASS, flash the normal production v4 image.
; Never deploy this image.
[env:rak4630_m4p3_history_v4_qual]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<journal_format.cpp>
    +<tlp_position_packet.cpp>
    +<nrf_history_flash.cpp>
    +<../tests/m4/m4p3_history_v4_qual_probe.cpp>
    +<../rakwireless/variants/rak4630>


; M4P3 TEST-ONLY record-driven History v4 page-rotation probe.
; Boot/recovery is read-only. Only explicit ROTATE mutates History, using the
; real HistoryStore + NrfHistoryFlash path to append valid synthetic POSITION
; records until a later-generation page is committed. The probe rejects any
; attempt by recovery to mint fresh entropy and requires the rotated page to
; preserve the existing incarnation. Never deploy this image.
[env:rak4630_m4p3_history_rotation_probe]
extends = env:rak4630
lib_deps =
extra_scripts =
    pre:scripts/check_storage_layout.py
build_src_filter =
    -<*>
    +<history_store.cpp>
    +<journal_format.cpp>
    +<tlp_position_packet.cpp>
    +<nrf_history_flash.cpp>
    +<../tests/m4/m4p3_history_rotation_probe.cpp>
    +<../rakwireless/variants/rak4630>
