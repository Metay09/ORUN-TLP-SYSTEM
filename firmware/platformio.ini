; ORUN TLP M0: RAK4630/RAK4631 Arduino firmware target.
[platformio]
default_envs = rak4630
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52@11.0.0
board = rak4630
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/check_storage_layout.py
    post:scripts/patch_wire.py
    post:scripts/patch_radio.py
    post:scripts/patch_internalfs.py
build_src_filter = ${env.build_src_filter}+<../rakwireless/variants/rak4630>
build_flags =
    -I rakwireless/variants/rak4630
    -I include
lib_deps =
    beegee-tokyo/SX126x-Arduino@2.0.32
    sparkfun/SparkFun u-blox GNSS Arduino Library@2.2.29


; Temporary/manual hardware evidence harness for M7P6B. This environment is
; intentionally separate from the production rak4630 image and is never a
; default_env. It provisions only a fixed synthetic test credential, verifies
; reset recovery/counter skip-ahead, then erases both SecurityStore pages.
[env:rak4630_m7p6b_physical]
extends = env:rak4630
build_flags =
    ${env:rak4630.build_flags}
    -D ORUN_M7P6B_PHYSICAL_TEST=1
