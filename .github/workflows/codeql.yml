name: ORUN CodeQL C-C++

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL C/C++
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality

      # Build the same host source graph already used as the canonical software
      # regression gate. This does not alter or instrument the RAK4630 image.
      - name: Build host source graph
        run: ./firmware/tests/run_host_tests.sh

      - name: Analyze
        uses: github/codeql-action/analyze@v4
