name: SF5C temporary validation

on:
  push:
    branches:
      - feat/sf5c-observation-store
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run full host suite with sanitizers and warnings-as-errors
        run: bash firmware/tests/run_host_tests.sh

  rak4630:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Build RAK4630 production firmware
        working-directory: firmware
        run: pio run -e rak4630
