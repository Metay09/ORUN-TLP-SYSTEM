name: SF5C temporary validation

on:
  push:
    branches:
      - feat/sf5c-observation-store
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run full host suite with sanitizers and warnings-as-errors
        shell: bash
        run: |
          set +e
          bash firmware/tests/run_host_tests.sh > /tmp/sf5c-host.log 2>&1
          code=$?
          echo "$code" > /tmp/sf5c-host.exit
          tail -n 200 /tmp/sf5c-host.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sf5c-host-log
          path: |
            /tmp/sf5c-host.log
            /tmp/sf5c-host.exit

  rak4630:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check platformio > /tmp/sf5c-pio-install.log 2>&1
          echo "$?" > /tmp/sf5c-pio-install.exit
          exit 0
      - name: Build RAK4630 production firmware
        shell: bash
        run: |
          set +e
          cd firmware
          pio run -e rak4630 > /tmp/sf5c-rak.log 2>&1
          code=$?
          echo "$code" > /tmp/sf5c-rak.exit
          tail -n 200 /tmp/sf5c-rak.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sf5c-rak-log
          path: |
            /tmp/sf5c-pio-install.log
            /tmp/sf5c-pio-install.exit
            /tmp/sf5c-rak.log
            /tmp/sf5c-rak.exit
