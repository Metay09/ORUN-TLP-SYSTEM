name: SF5J2B1 firmware verification

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/sf5j2b1-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-host:
    name: Full host suite (sanitizers)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          g++ --version | head -n 1
          python3 --version
      - name: Run complete host verification
        run: bash firmware/tests/run_host_tests.sh

  rak4630:
    name: RAK4630 build only (no upload)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO CLI
        run: python -m pip install 'platformio==6.1.18'
      - name: Compile production target
        run: pio run -d firmware -e rak4630
