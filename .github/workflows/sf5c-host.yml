name: SF5C temporary host validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch, test and publish temporary result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          {
            echo "HEAD_SHA=${HEAD_SHA}"
            curl -fL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/tarball/${HEAD_SHA}" \
              -o /tmp/repo.tar.gz
            mkdir -p /tmp/repo
            tar -xzf /tmp/repo.tar.gz -C /tmp/repo --strip-components=1
            cd /tmp/repo
            bash firmware/tests/run_host_tests.sh
          } > /tmp/sf5c-host.log 2>&1
          rc=$?
          tail -n 160 /tmp/sf5c-host.log > /tmp/sf5c-tail.log
          RC="$rc" python3 - <<'PY' > /tmp/comment.json
          import json, os
          from pathlib import Path
          tail = Path('/tmp/sf5c-tail.log').read_text(errors='replace')
          body = '<!-- sf5c-temp-ci -->\nTemporary SF5C host validation exit code: **' + os.environ['RC'] + '**\n\n```text\n' + tail[-30000:] + '\n```'
          print(json.dumps({'body': body}))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/comment.json
          exit "$rc"
