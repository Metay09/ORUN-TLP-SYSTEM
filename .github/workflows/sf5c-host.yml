name: SF5C temporary host validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run full host suite
        id: host
        shell: bash
        run: |
          set +e
          bash firmware/tests/run_host_tests.sh > sf5c-host.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat sf5c-host.log
          exit "$rc"
      - name: Upload host log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf5c-host-log
          path: sf5c-host.log
          if-no-files-found: error
