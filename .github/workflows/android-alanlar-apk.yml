name: Android debug APK (Alanlar review)

on:
  push:
    branches:
      - feat/app-zones-local-editor
    paths:
      - 'edge/app/**'
      - '.github/workflows/android-alanlar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Test and package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge/app/package-lock.json
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install packages
        working-directory: edge/app
        run: npm ci
      - name: Run app tests
        working-directory: edge/app
        run: npm test
      - name: Compile web app
        working-directory: edge/app
        run: npm run build
      - name: Sync Capacitor Android project
        working-directory: edge/app
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: edge/app/android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload ORUN Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ORUN-Alanlar-Android-debug
          path: edge/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
