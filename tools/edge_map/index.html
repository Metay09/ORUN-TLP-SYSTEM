<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORUN Saha Haritası</title>
<link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css">
<style>
  :root {
    --bg: #0f1412;
    --panel: rgba(17, 23, 21, 0.94);
    --line: #26302c;
    --text: #e8eee9;
    --muted: #93a29a;
    --accent: #f2b53a;
    --ok: #5fc48a;
    --warn: #e7a33e;
    --bad: #e2574c;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }
  .panel {
    position: fixed; z-index: 1000; top: 12px; left: 12px; width: 340px;
    max-height: calc(100% - 24px); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 8px 30px rgba(0,0,0,.35); backdrop-filter: blur(6px);
  }
  .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font-size: 18px; letter-spacing: .14em; color: var(--accent); }
  .brand span { color: var(--muted); font-size: 12px; }
  .status { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(95,196,138,.18); }
  .dot.err { background: var(--bad); }
  .body { overflow: auto; padding: 10px 12px 12px; }
  .tracker { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .tracker:hover { border-color: #3a4842; }
  .tracker .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tracker .id { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #1b2420; border: 1px solid var(--line); color: var(--text); }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  h3 { margin: 12px 4px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 6px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .list li:hover { background: #18201c; }
  .list .seq { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
  .list .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .b { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 16px 6px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button { background: #1b2420; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: #3a4842; }
  .note { color: var(--muted); font-size: 11px; padding: 8px 4px 0; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #141b18; color: var(--text); border: 1px solid var(--line); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  .pop b { color: var(--accent); }
  .pop table { border-collapse: collapse; margin-top: 4px; }
  .pop td { padding: 1px 8px 1px 0; } .pop td:first-child { color: var(--muted); }
  .leaflet-control-layers { background: var(--panel); color: var(--text); border: 1px solid var(--line) !important; }
  .legend { display: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }
  .legend.on { display: block; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend .meta { margin-top: 4px; }
  .seg { display: flex; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: #2a3530; color: var(--accent); }
  .sizes { display: flex; gap: 6px; margin: 6px 0 4px; }
  .sizes button { padding: 3px 9px; }
  .sizes button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .late { color: var(--warn); font-size: 11px; margin-left: 4px; }
  .last-marker { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(242,181,58,.25); }
  @media (max-width: 700px) {
    .panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 46%;
      border-radius: var(--radius) var(--radius) 0 0; padding-bottom: env(safe-area-inset-bottom); }
  }
</style>
</head>
<body>
<div id="map"></div>
<aside class="panel" aria-label="ORUN durum paneli">
  <div class="head">
    <div class="brand"><b>ORUN</b><span>Saha haritası · masa testi</span></div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Yükleniyor…</span></div>
    <div class="btns">
      <button id="fit" type="button">Tümünü göster</button>
      <button id="follow" type="button" aria-pressed="true">Son konumu izle: açık</button>
    </div>
    <div class="seg" role="group" aria-label="Görünüm">
      <button type="button" data-view="track" aria-pressed="true">İz</button>
      <button type="button" data-view="range" aria-pressed="false">Menzil</button>
      <button type="button" data-view="grid" aria-pressed="false">Kapsama</button>
    </div>
  </div>
  <div class="body">
    <div id="legend" class="legend" aria-label="Sinyal gücü açıklaması"></div>
    <div id="trackers"></div>
    <h3>Son kayıtlar</h3>
    <ul id="recent" class="list"></ul>
    <div class="note">Zaman, tasmanın kaydı aldığı andır (yerel saat). Büyük işaret her zaman ölçüm zamanı en yeni konumdur; geç gelen eski kayıtlar yalnızca geçmiş izine eklenir. Tasma önce en yeni kaydı gönderir, birikmişler aradaki boşluklarda gelir.</div>
  </div>
</aside>

<script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
<script>
(() => {
  "use strict";
  const COLORS = ["#f2b53a", "#5fc48a", "#5aa9e6", "#e2574c", "#b58cf0", "#e88bc4"];
  const REFRESH_MS = 10000;

  const map = L.map("map", { zoomControl: false, attributionControl: true });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, maxNativeZoom: 18, attribution: "Uydu: Esri, Maxar, Earthstar Geographics" });
  const street = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "&copy; OpenStreetMap katkıcıları" });
  satellite.addTo(map);
  L.control.layers({ "Uydu": satellite, "Harita": street }, null, { position: "topright" }).addTo(map);
  map.setView([37.6106, 28.0548], 16);

  // Keep the bounds clear of the panel: left column on wide screens,
  // bottom sheet on phones.
  const fitOptions = () => {
    const panel = document.querySelector(".panel").getBoundingClientRect();
    return window.innerWidth > 700
      ? { paddingTopLeft: [panel.right + 24, 40], paddingBottomRight: [40, 40], maxZoom: 19 }
      : { paddingTopLeft: [24, 60], paddingBottomRight: [24, panel.height + 24], maxZoom: 19 };
  };
  const layers = new Map();   // tracker id -> {line, dots, last}
  let follow = true;
  let fittedOnce = false;
  let lastKey = "";
  let lastOk = 0;
  let lastPoints = [];
  let view = "track";              // track | range (points by RSSI) | grid (coverage cells)
  let cellM = 5;                    // coverage cell edge, metres
  try { const v = localStorage.getItem("orun.view"); if (["track", "range", "grid"].includes(v)) view = v;
        const c = Number(localStorage.getItem("orun.cell")); if ([3, 5, 10, 20].includes(c)) cellM = c; } catch (_) {}
  const gridLayer = L.layerGroup().addTo(map);
  let serverOffset = 0;            // PC clock - phone clock, so ages use the PC
  let ageChips = [];               // {span, time, period}: refreshed every poll
  const nowMs = () => Date.now() + serverOffset;

  // Gateway RSSI as heard from the collar (SX1262, SF11/125 kHz).
  const BANDS = [
    [-105, "#5fc48a", "Güçlü (−105 dBm ve üstü)"],
    [-115, "#c9d45a", "İyi (−105 … −115)"],
    [-125, "#e7a33e", "Zayıf (−115 … −125)"],
    [-999, "#e2574c", "Sınırda (−125 altı)"],
  ];
  const NO_SIGNAL = "#6b7771";
  // ---- Coverage grid ------------------------------------------------------
  // The tool classifies every record's link (p.link, see classify_links in
  // tools/orun_edge_bench.py): "live" (radio facts belong to where it was
  // recorded), "through" (got through, no usable signal), "cut" (recorded
  // while the Gateway was being listened to and nothing arrived live around
  // it) or null: a record that only waited in the collar's queue, or was
  // recorded while nobody listened, says nothing about coverage.
  const CUT_S = 180;                // "geç geldi" label only
  const SNR_FLOOR = -17.5;          // SX1262 demodulation floor at SF11
  const GOOD_FIX = (p) => p.sats != null && p.sats >= 5 && p.hdop != null && p.hdop <= 4;
  const CELL_BANDS = [
    [15, "#5fc48a", "Güçlü (SNR payı ≥ 15 dB)"],
    [8, "#c9d45a", "İyi (8 … 15 dB)"],
    [3, "#e7a33e", "Zayıf (3 … 8 dB)"],
    [-99, "#e2574c", "Sınırda (3 dB altı)"],
  ];
  const CUT = "#a23a8c";            // most records here did not get through
  const median = (xs) => { const a = [...xs].sort((x, y) => x - y); const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const classify = (p) => (p.link && GOOD_FIX(p) ? p.link : null);
  function buildGrid(points) {
    const usable = points.filter(p => classify(p));
    if (!usable.length) return [];
    // Local metric frame anchored at a fixed rounded origin, so cells are stable.
    const lat0 = Math.round(usable[0].lat * 100) / 100, lon0 = Math.round(usable[0].lon * 100) / 100;
    const my = 111320, mx = 111320 * Math.cos(lat0 * Math.PI / 180);
    const cells = new Map();
    for (const p of usable) {
      const ix = Math.floor((p.lon - lon0) * mx / cellM), iy = Math.floor((p.lat - lat0) * my / cellM);
      const key = ix + ":" + iy;
      let c = cells.get(key);
      if (!c) { c = { ix, iy, live: 0, through: 0, cut: 0, snr: [], rssi: [] }; cells.set(key, c); }
      const k = classify(p);
      c[k]++;
      if (k === "live") { c.snr.push(p.snr); c.rssi.push(p.rssi); }
    }
    return [...cells.values()].map(c => {
      const n = c.live + c.through + c.cut;
      const ratio = (c.live + c.through) / n;
      const margin = c.snr.length ? median(c.snr) - SNR_FLOOR : null;
      const color = ratio < 0.5 ? CUT
        : margin == null ? NO_SIGNAL : CELL_BANDS.find(b => margin >= b[0])[1];
      const bounds = [[lat0 + c.iy * cellM / my, lon0 + c.ix * cellM / mx],
                      [lat0 + (c.iy + 1) * cellM / my, lon0 + (c.ix + 1) * cellM / mx]];
      return { ...c, n, ratio, margin, color, bounds };
    });
  }
  function renderGrid(points) {
    gridLayer.clearLayers();
    if (view !== "grid") return [];
    const cells = buildGrid(points);
    for (const c of cells) {
      const box = el("div", "pop");
      box.appendChild(el("b", null, "Kare " + cellM + " m · " + c.n + " kayıt"));
      const t = el("table");
      const rows = [
        ["Anında geçti", Math.round(100 * c.ratio) + "% (" + (c.live + c.through) + "/" + c.n + ")"],
        ["SNR payı", c.margin != null ? c.margin.toFixed(1) + " dB (ortanca, " + c.snr.length + " ölçüm)" : "ölçüm yok"],
        ["Sinyal", c.rssi.length ? median(c.rssi).toFixed(0) + " dBm (ortanca)" : "–"],
      ];
      for (const [k, v] of rows) { const tr = el("tr"); tr.appendChild(el("td", null, k)); tr.appendChild(el("td", null, v)); t.appendChild(tr); }
      box.appendChild(t);
      L.rectangle(c.bounds, { color: c.color, weight: 1, opacity: .9, fillColor: c.color,
        fillOpacity: Math.min(.85, .35 + .1 * c.n) }).bindPopup(box).addTo(gridLayer);
    }
    return cells;
  }

  const rssiColor = (p) => p.rssi == null ? NO_SIGNAL : BANDS.find(b => p.rssi >= b[0])[1];
  const isLate = (p) => p.delay_s != null && p.delay_s > CUT_S;
  const fmtDur = (s) => s < 60 ? s + " sn" : s < 3600 ? Math.round(s / 60) + " dk"
    : s < 172800 ? (s / 3600).toFixed(1) + " sa" : Math.round(s / 86400) + " gün";
  // Freshness of the newest position versus the collar's own report period.
  function freshness(time, period) {
    if (!time) return ["bad", "zaman yok"];
    const age = nowMs() - new Date(time).getTime();
    const p = Math.max(60, period || 60) * 1000;
    const cls = age <= 2 * p + 120000 ? "ok" : age <= 6 * p ? "warn" : "bad";
    return [cls, "Son konum " + ago(age) + (cls === "bad" ? " · ESKİ" : "")];
  }

  const fmtTime = (iso) => iso ? new Date(iso).toLocaleString("tr-TR",
    { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "zaman yok";
  const ago = (ms) => {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + " sn önce";
    const m = Math.round(s / 60);
    if (m < 60) return m + " dk önce";
    const h = Math.round(m / 60);
    if (h < 48) return h + " sa önce";
    return Math.round(h / 24) + " gün önce";
  };
  const batteryClass = (p) => p.battery === "CRITICAL" ? "bad" : p.battery === "LOW" ? "warn" : "ok";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function popup(p) {
    const box = el("div", "pop");
    box.appendChild(el("b", null, "Tasma " + p.tracker.slice(-6)));
    const t = el("table");
    const rows = [
      ["Kayıt", "#" + p.seq],
      ["Zaman", fmtTime(p.time)],
      ["Konum", p.lat.toFixed(6) + ", " + p.lon.toFixed(6)],
      ["Uydu / HDOP", (p.sats ?? "–") + " / " + (p.hdop != null ? p.hdop.toFixed(2) : "–")],
      ["Pil", p.battery_mv != null ? p.battery_mv + " mV " + (p.battery || "") : "–"],
      ["Aktif", p.active_s != null ? p.active_s + " / " + p.covered_s + " sn" : "–"],
      ["Sinyal", p.rssi != null ? p.rssi + " dBm · SNR " + p.snr + " dB" : "ölçüm yok"],
      ["Gecikme", p.delay_s != null ? fmtDur(p.delay_s) + (isLate(p) ? " (geç geldi)" : "") : "–"],
    ];
    for (const [k, v] of rows) {
      const tr = el("tr"); tr.appendChild(el("td", null, k)); tr.appendChild(el("td", null, v)); t.appendChild(tr);
    }
    box.appendChild(t);
    return box;
  }

  function lastIcon(color) {
    const d = el("div", "last-marker"); d.style.background = color;
    return L.divIcon({ className: "", html: d.outerHTML, iconSize: [18, 18], iconAnchor: [9, 9] });
  }

  function render(points) {
    const byTracker = new Map();
    for (const p of points) {
      if (!byTracker.has(p.tracker)) byTracker.set(p.tracker, []);
      byTracker.get(p.tracker).push(p);
    }
    lastPoints = points;
    const trackersBox = document.getElementById("trackers");
    trackersBox.replaceChildren();
    ageChips = [];
    const allLatLng = [];
    let newest = null;
    let i = 0;
    for (const [id, list] of byTracker) {
      const color = COLORS[i++ % COLORS.length];
      list.sort((a, b) => (a.time || "").localeCompare(b.time || "") || a.seq - b.seq);
      const latlngs = list.map(p => [p.lat, p.lon]);
      allLatLng.push(...latlngs);
      let layer = layers.get(id);
      if (!layer) {
        layer = { line: L.polyline([], { color, weight: 3, opacity: .85 }).addTo(map),
                  dots: L.layerGroup().addTo(map), last: null };
        layers.set(id, layer);
      }
      layer.line.setLatLngs(latlngs);
      layer.line.setStyle({ opacity: view === "track" ? .85 : view === "range" ? .3 : .15 });
      layer.dots.clearLayers();
      list.forEach((p, k) => {
        const age = list.length > 1 ? k / (list.length - 1) : 1;
        if (view === "grid") return;
        const style = view === "range"
          ? { radius: 6, color: "#0b0f0d", weight: 1, fillColor: rssiColor(p), fillOpacity: .92 }
          : { radius: 4, color: "#0b0f0d", weight: 1, fillColor: color, fillOpacity: .35 + .55 * age };
        L.circleMarker([p.lat, p.lon], style).bindPopup(() => popup(p)).addTo(layer.dots);
      });
      const last = list[list.length - 1];
      if (layer.last) layer.last.remove();
      layer.last = L.marker([last.lat, last.lon], { icon: lastIcon(color), zIndexOffset: 1000 })
        .bindPopup(() => popup(last)).addTo(map);
      if (!newest || (last.time || "") > (newest.time || "")) newest = last;

      const card = el("div", "tracker");
      const r1 = el("div", "row1");
      const name = el("div", "id"); const sw = el("span", "swatch"); sw.style.background = color;
      name.appendChild(sw); name.appendChild(document.createTextNode(id));
      r1.appendChild(name); r1.appendChild(el("span", "meta", list.length + " kayıt"));
      card.appendChild(r1);
      const chips = el("div", "chips");
      const [fcls, ftext] = freshness(last.time, last.period_s);
      const fchip = el("span", "chip " + fcls, ftext);
      ageChips.push({ span: fchip, time: last.time, period: last.period_s });
      chips.appendChild(fchip);
      chips.appendChild(el("span", "chip", fmtTime(last.time)));
      if (last.rssi != null) chips.appendChild(el("span", "chip", last.rssi + " dBm"));
      if (last.battery_mv != null) chips.appendChild(el("span", "chip " + batteryClass(last), last.battery_mv + " mV"));
      if (last.sats != null) chips.appendChild(el("span", "chip", last.sats + " uydu"));
      card.appendChild(chips);
      card.appendChild(el("div", "meta", last.lat.toFixed(6) + ", " + last.lon.toFixed(6)));
      card.addEventListener("click", () => { map.setView([last.lat, last.lon], Math.max(map.getZoom(), 17)); layer.last.openPopup(); });
      trackersBox.appendChild(card);
    }
    for (const [id, layer] of layers) {
      if (!byTracker.has(id)) { layer.line.remove(); layer.dots.remove(); if (layer.last) layer.last.remove(); layers.delete(id); }
    }

    const recent = document.getElementById("recent");
    recent.replaceChildren();
    const sorted = [...points].sort((a, b) => (b.time || "").localeCompare(a.time || "") || b.seq - a.seq).slice(0, 40);
    if (!sorted.length) recent.appendChild(el("li", "empty", "Henüz konumlu kayıt yok."));
    for (const p of sorted) {
      const li = el("li");
      li.appendChild(el("span", "seq", "#" + p.seq));
      const t = el("span", "t", fmtTime(p.time));
      if (isLate(p)) t.appendChild(el("span", "late", "geç · " + fmtDur(p.delay_s)));
      li.appendChild(t);
      li.appendChild(el("span", "b", view !== "track"
        ? (p.rssi != null ? p.rssi + " dBm" : "–")
        : (p.battery_mv != null ? p.battery_mv + " mV" : "")));
      li.addEventListener("click", () => { map.setView([p.lat, p.lon], Math.max(map.getZoom(), 18)); L.popup().setLatLng([p.lat, p.lon]).setContent(popup(p)).openOn(map); });
      recent.appendChild(li);
    }

    renderLegend(points, renderGrid(points));
    if (allLatLng.length && !fittedOnce) {
      map.fitBounds(L.latLngBounds(allLatLng), fitOptions());
      fittedOnce = true;
    } else if (follow && newest) {
      map.panTo([newest.lat, newest.lon]);
    }
    document.getElementById("fit").onclick = () => {
      if (allLatLng.length) map.fitBounds(L.latLngBounds(allLatLng), fitOptions());
    };
  }

  function swatchRow(box, color, label) {
    const row = el("div", "row"); const sw = el("span", "swatch"); sw.style.background = color;
    row.appendChild(sw); row.appendChild(document.createTextNode(label)); box.appendChild(row);
  }
  function renderLegend(points, cells) {
    const box = document.getElementById("legend");
    box.classList.toggle("on", view !== "track");
    box.replaceChildren();
    if (view === "track") return;
    if (view === "grid") {
      box.appendChild(el("b", null, "Kapsama (kare başına)"));
      const sizes = el("div", "sizes");
      for (const m of [3, 5, 10, 20]) {
        const b = el("button", null, m + " m"); b.type = "button";
        b.setAttribute("aria-pressed", String(m === cellM));
        b.addEventListener("click", () => { cellM = m; try { localStorage.setItem("orun.cell", String(m)); } catch (_) {} render(lastPoints); });
        sizes.appendChild(b);
      }
      box.appendChild(sizes);
      for (const [, color, label] of CELL_BANDS) swatchRow(box, color, label);
      swatchRow(box, CUT, "Kopuk (kayıtların yarıdan azı anında geçti)");
      swatchRow(box, NO_SIGNAL, "Geçti, sinyal ölçümü yok");
      const used = cells.reduce((a, c) => a + c.n, 0);
      box.appendChild(el("div", "meta", cells.length + " kare · " + used + " kayıt kullanıldı. " +
        "Sayılmayanlar: zayıf konum (5'ten az uydu / HDOP > 4), kuyrukta bekleyip geç gelenler ve araç çalışmıyorken kaydedilenler."));
      return;
    }
    box.appendChild(el("b", null, "Gateway'in duyduğu sinyal"));
    for (const [, color, label] of BANDS.concat([[0, NO_SIGNAL, "Ölçüm yok (eski / dökümden gelen kayıt)"]])) {
      const row = el("div", "row"); const sw = el("span", "swatch"); sw.style.background = color;
      row.appendChild(sw); row.appendChild(document.createTextNode(label)); box.appendChild(row);
    }
    const measured = points.filter(p => p.rssi != null);
    if (measured.length) {
      const worst = measured.reduce((a, b) => (b.rssi < a.rssi ? b : a));
      box.appendChild(el("div", "meta", measured.length + "/" + points.length +
        " kayıtta ölçüm · en zayıf " + worst.rssi + " dBm (SNR " + worst.snr + ")"));
    }
  }

  // Same JSON from the PC tool (/api/points) or, inside the ORUN Edge phone
  // app (edge/app), from the phone's own ledger via the parent page.
  async function loadPoints() {
    let provider = null;
    try { if (window.parent !== window) provider = window.parent.orunPoints; } catch (_) {}
    if (typeof provider === "function") return await provider();
    const r = await fetch("/api/points", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }

  async function refresh() {
    const dot = document.getElementById("dot"), status = document.getElementById("status");
    try {
      const data = await loadPoints();
      if (data.now) serverOffset = new Date(data.now).getTime() - Date.now();
      const key = data.count + ":" + data.points.map(p => p.tracker + p.seq).slice(-1)[0];
      if (key !== lastKey) { render(data.points); lastKey = key; }
      for (const a of ageChips) {
        const [cls, text] = freshness(a.time, a.period);
        a.span.className = "chip " + cls; a.span.textContent = text;
      }
      lastOk = Date.now();
      dot.className = "dot live";
      status.textContent = data.count + " konumlu kayıt · " + (data.skipped ? data.skipped + " konumsuz · " : "") + "güncellendi";
    } catch (e) {
      dot.className = "dot err";
      status.textContent = "Bağlantı yok (" + e.message + ")" + (lastOk ? " · son başarılı " + ago(Date.now() - lastOk) : "");
    }
  }

  document.getElementById("follow").addEventListener("click", (ev) => {
    follow = !follow;
    ev.currentTarget.setAttribute("aria-pressed", String(follow));
    ev.currentTarget.textContent = "Son konumu izle: " + (follow ? "açık" : "kapalı");
  });
  const segButtons = document.querySelectorAll(".seg button");
  const showView = () => segButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  segButtons.forEach(b => b.addEventListener("click", () => {
    view = b.dataset.view;
    try { localStorage.setItem("orun.view", view); } catch (_) {}
    showView();
    render(lastPoints);
  }));
  showView();
  map.on("dragstart", () => {
    if (!follow) return;
    follow = false;
    const b = document.getElementById("follow");
    b.setAttribute("aria-pressed", "false"); b.textContent = "Son konumu izle: kapalı";
  });

  refresh();
  setInterval(refresh, REFRESH_MS);
  window.orunRefresh = refresh;   // the phone app calls this when new records land
})();
</script>
