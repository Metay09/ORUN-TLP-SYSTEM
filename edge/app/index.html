<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F2">
<title>ORUN</title>
<script>
// İlk kare doğru temada çizilsin (açılış ekranı koyu zeminden açık zemine
// sıçramasın): App'teki useTheme ile aynı kural, React gelmeden.
try {
  var t = (JSON.parse(localStorage.getItem("orun.app.prefs.v1") || "{}") || {}).theme || "auto";
  var dark = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
} catch (e) { /* App sets it */ }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
